services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dkctf
      POSTGRES_USER: dkctf
      POSTGRES_PASSWORD: dkctf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dkctf -d dkctf"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - dkctf-postgres:/var/lib/postgresql/data

  nex:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PN_DKCTF_AUTH_PORT: "28000"
      PN_DKCTF_SECURE_PORT: "28001"
      # The address a console is told to reach the secure server on. Override
      # in .env or the shell; defaults to localhost for a LAN test.
      PN_DKCTF_SECURE_HOST: ${PN_DKCTF_SECURE_HOST:-localhost}
      PN_DKCTF_POSTGRES_URI: postgres://dkctf:dkctf@postgres:5432/dkctf?sslmode=disable
      PN_DKCTF_KERBEROS_PASSWORD: ${PN_DKCTF_KERBEROS_PASSWORD:-change-me}
      # Local preservation mode: accounts from settings.json, login token not
      # validated. Flip to shared mode by setting PN_DKCTF_LOCAL_MODE=0
      # and providing the two NEX_* secrets (matching your account server).
      PN_DKCTF_LOCAL_MODE: ${PN_DKCTF_LOCAL_MODE:-1}
      PN_DKCTF_SETTINGS_PATH: /home/go/app/settings.json
      PN_DKCTF_NEX_TOKEN_AES_KEY: ${PN_DKCTF_NEX_TOKEN_AES_KEY:-}
      PN_DKCTF_NEX_PASSWORD_SECRET: ${PN_DKCTF_NEX_PASSWORD_SECRET:-}
      # Optional S3 for DataStore object uploads (downloads work without it).
      PN_S3_ENDPOINT: ${PN_S3_ENDPOINT:-}
      PN_S3_ACCESS_KEY: ${PN_S3_ACCESS_KEY:-}
      PN_S3_SECRET_KEY: ${PN_S3_SECRET_KEY:-}
      PN_S3_BUCKET: ${PN_S3_BUCKET:-dkctf-datastore}
    ports:
      - "28000:28000/udp"
      - "28001:28001/udp"
    volumes:
      - ./settings.json:/home/go/app/settings.json:ro
      # PNID names written by the token service (PN_ACCOUNT_NAMES_DIR)
      - ${PN_DKCTF_NAMES_HOST_DIR:-./names}:/names:ro

volumes:
  dkctf-postgres:
